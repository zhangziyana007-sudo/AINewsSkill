name: 每日AI早报

on:
  schedule:
    # 每天 UTC 1:30 = 北京时间 9:30
    - cron: '30 0 * * *'  # UTC 00:30 = 北京 08:30（GitHub Actions 通常会延迟 30-60min，落到 9 点附近）
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      - name: 安装 Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 安装中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -fv

      - name: 运行全流程
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: node bin/ainews.mjs run --force --ai

      - name: 创建 daily release 并上传图片/素材
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          TAG="daily-$DATE"
          PROJECT=$(ls -d output/ai-daily-* | tail -n 1)
          NAME=$(basename "$PROJECT")  # ai-daily-MMDD
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "📦 Release: $TAG ← $PROJECT"
          # 清理同名 release（重跑场景）
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          # 收集 asset
          ASSETS=()
          for f in "$PROJECT"/images/page*.png "$PROJECT/xhs-package.txt" "$PROJECT/xhs-package.md" "$PROJECT/data.json"; do
            [ -f "$f" ] && ASSETS+=("$f")
          done
          # 创建 release
          NOTES="$DATE AI 大模型新闻早报"
          if [ -f "$PROJECT/xhs-package.md" ]; then NOTES_FILE="$PROJECT/xhs-package.md"; else NOTES_FILE=""; fi
          if [ -n "$NOTES_FILE" ]; then
            gh release create "$TAG" --title "📰 AI 早报 $DATE" --notes-file "$NOTES_FILE" "${ASSETS[@]}"
          else
            gh release create "$TAG" --title "📰 AI 早报 $DATE" --notes "$NOTES" "${ASSETS[@]}"
          fi
          echo "✅ Release 创建完成"

      - name: 重新生成 API JSON（带 release URL）
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          PROJECT=$(ls -d output/ai-daily-* | tail -n 1)
          node scripts/publish-api.mjs --input="$PROJECT"

      - name: 提交 API JSON + 文本素材到仓库（不含图片）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/api/ output/ai-daily-*/data.json output/ai-daily-*/xhs-package.md output/ai-daily-*/xhs-package.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: 更新每日产物 $(date +%Y-%m-%d)"
          git push

      - name: 清理超过 30 天的 daily release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/cleanup-releases.mjs --keep=30
