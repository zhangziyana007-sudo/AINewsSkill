<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Daily · News</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="canvas scanline">
    <!-- 装饰 -->
    <div class="glow-orb glow-orb-1"></div>

    <!-- 状态条 -->
    <div class="status-bar">
      <div class="status-bar-left">
        <div class="pulse-dot"></div>
        <span class="mono" style="font-size:16px; color:var(--fg-2);">AI_DAILY</span>
        <span class="mono" style="font-size:14px; color:var(--fg-3);">{{issue}}</span>
      </div>
      <div class="status-bar-right">{{date}}</div>
    </div>

    <!-- 页面标题区（可选，通过渲染脚本条件注入） -->
    %%SLOT_PAGE_HEADER%%

    <!-- 新闻列表 -->
    <div class="content-area">
      <div class="news-list" data-count="{{itemCount}}">
        %%SLOT_NEWS_CARDS%%
      </div>
    </div>

    <!-- 底部 -->
    <div class="footer-bar">
      <span>AI Daily · {{dateShort}}</span>
      <span>{{pageNum}}/{{totalPages}}</span>
    </div>
  </div>
</body>
</html>
